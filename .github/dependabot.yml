version: 2
updates:
  # Root Bun project. Dependabot's bun updater reads bun.lock lockfileVersion 2 and 3
  # (dependabot-core #16485, MAX_SUPPORTED_LOCKFILE_VERSION = 3, bundled bun 1.4.2).
  # Check after a change here: watch ONE scheduled run of this entry; a parser failure is immediate.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels: [dependencies, bun]
    groups:
      # One PR for all MathTS packages: siblings must share ONE core copy (instanceof across packages).
      mathts:
        patterns:
          - "@danielsimonjr/mathts-*"
    ignore:
      # vitest 5 is an API migration for this repo, not a bump. `bench` is no longer a top-level
      # export; it is a test-context fixture, so every bench() call in the 14 files under bench/
      # must move inside a test() and await .run(). PR #177 was closed for this reason.
      # Remove this rule once the benches are migrated.
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      # @vitest/* packages (coverage-v8 and the rest) peer-require the matching vitest major, so
      # their major bump cannot install until vitest moves too.
      - dependency-name: "@vitest/*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels: [dependencies, github-actions]
