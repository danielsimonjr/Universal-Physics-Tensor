version: 2
updates:
  # npm, not bun, DELIBERATELY. Dependabot parses only bun.lock lockfileVersion 1 and Bun
  # writes 2, so every bun updater run fails with "Unsupported bun.lock lockfileVersion 2"
  # and no dependency update gets proposed (same fix already applied to deepthinking-mcp
  # and math-mcp after the identical failure there). Security alerts keep working
  # (dependency-graph based); automated remediation is what dies under the bun ecosystem.
  #
  # No package-lock.json is committed, so npm updates package.json ranges only and bun.lock
  # stays authoritative -- regenerated by `bun install` in a follow-up commit, never by
  # Dependabot. A second committed lockfile would be a second source of truth to drift.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels: [dependencies, bun]
    ignore:
      # vitest 5 is NOT a bump for this repo, it is an API migration. `bench` stopped being a
      # top-level export and became a test-context fixture, so all 31 bench() call sites across
      # the 14 files in bench/ must move inside a test() and await .run(). PR #177 was closed for
      # this reason on 2026-09-21 with nothing forcing it - zero open Dependabot alerts.
      # Without this ignore the same PR returns next week and the analysis is redone from scratch.
      # REMOVE THIS ENTRY once the benches are migrated; then the bump is a one-line change.
      - dependency-name: vitest
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels: [dependencies, github-actions]
