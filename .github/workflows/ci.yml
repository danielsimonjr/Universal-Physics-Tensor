name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# Pinned explicitly rather than inheriting the repository default. The default is `read`
# today, but it is a repo-level setting any future change can widen silently, and a workflow
# with no block inherits whatever it becomes. Every job here only checks out, builds, type-checks,
# tests, audits or diffs generated docs -- none of it needs more than read.
permissions:
  contents: read

# Every third-party action is pinned to a commit with its version in a comment. A tag such as
# `@v7` can be moved to other code after review; a commit cannot. tests/tools/ci-workflows.test.ts
# fails on a tag pin. The Bun install cache (~/.bun/install/cache, keyed on bun.lock) is restored
# before every `bun install`; a miss is a normal install, never a failure.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Bun first: it needs no repository content, and every job that invokes `bun` must install it.
      # Anchoring setup-bun to setup-node previously left jobs that lack the latter with rewritten
      # commands and no runtime to run them.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The shrink check reads tools/layer-order/allowlist.json from origin/master. A
      # depth-1 checkout of the pull-request branch does not have that ref.
      - name: Fetch master for the layer-order shrink check
        run: git fetch origin master --depth=1
      # Node stays: Bun is the package manager and script driver; Node is the runtime under test
      # and what the published library ships to. No `cache: npm` — package-lock.json is gone.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Restore Bun's install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # One compile of src (`tsc` fails on a type error whether or not it emits), one of the
      # tests project, one run of the suite. `bun run typecheck` would compile src again with
      # --noEmit, and `bun run test` would compile it a third time through `pretest`.
      - run: bun run build
      - run: bun run typecheck:tests
      # `--coverage` on the ONE suite run is Product B's coverage gate: vitest.config.ts limits
      # the report to src/composition/probe and sets the thresholds (statements/lines/functions
      # 95, branches 85). A separate `test:probe-coverage` step once ran the probe tests a second
      # time for the same number. The gate was once run only by hand, and branch coverage fell
      # below its threshold unnoticed; a gate CI does not run is a gauge, not a gate.
      - run: bunx vitest run --coverage
        env:
          UPT_REQUIRE_PEERS: '1'

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch master for the layer-order shrink check
        run: git fetch origin master --depth=1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Restore Bun's install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run layer:check
      - run: bun run audit:plans
      - run: bun run package:check
      # `npm audit` requires package-lock.json; Bun owns the lockfile now.
      - run: bun audit --audit-level=high

  docs-fresh:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Restore Bun's install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run docs:deps
      - name: Fail when committed architecture docs are stale
        run: |
          if ! git diff --quiet -- docs/architecture/; then
            echo "::error::docs/architecture/ is stale -- run 'bun run docs:deps' and commit the result."
            git diff --stat -- docs/architecture/
            exit 1
          fi
          echo "docs/architecture/ matches a fresh generation."
      - name: Fail when README and ROADMAP status spans are stale
        run: bun scripts/readme-status.ts --check
      - name: Fail when the catalog census is stale
        run: bun scripts/catalog-census.ts --check
      - name: Fail when the CLI reference is stale
        run: bun scripts/cli-reference.ts --check
      - name: Fail when the generated Lean table is stale
        run: bun scripts/generate-physjs-table.ts --check
      # The Lean index (lean/ listing, theorem -> file table) is read from this repository's lean/,
      # and the manifest's toolchain, Mathlib and Physlib must be the lake project's. Before 11.0.0
      # these were copies of PhysJS at a pinned commit and this job fetched PhysJS to compare them;
      # the proofs are here now, so nothing is fetched.
      - name: Fail when the Lean index is stale
        run: bun scripts/lean-index.ts --check

  # Non-required on purpose. The local pre-push hook still runs the private
  # code_docs.py against .githooks/code-docs-baseline.txt. A GitHub-UI merge
  # never runs that hook, so this job runs the in-repo --paths stand-in: a
  # changed src file may not add an export whose immediately preceding JSDoc
  # has no summary, and may not drop a summary the base ref had. Pre-existing
  # debt does not fail the job. The job does not read the baseline and does
  # not raise it.
  #
  # It runs on a pull request against its base branch, and on a push to master
  # against the commit the push replaced (`github.event.before`): the recorded
  # local workflow is a direct push to master, and a job that ran only on pull
  # requests never saw one. A first push, or a force push, has no usable
  # `before` and is not the shape of this repository's history.
  #
  # The architecture-docs claims check (`repo-tools check`) runs in the
  # pre-push hook and not in CI. This job does not change branch protection.
  # The check name says non-required so a reader does not mistake it for one
  # of the required contexts.
  code-docs-ratchet:
    name: code-docs ratchet (non-required)
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Restore Bun's install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Fail when this change adds an undocumented export
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          bun tools/code-docs-ratchet/check.ts --base "$base"

  # Which expensive suites does this change need? Computed with git rather than a third-party
  # paths-filter action: one less action to SHA-pin and audit for a two-line diff check.
  #
  # numerical: does this PR touch the numerical core? The accuracy suite below is expensive, so it
  # is schedule/dispatch-only -- but that meant a pull request could change floating-point code and
  # merge with the one suite that would catch a regression never having run. v0.44.3 was exactly
  # that shape: a term-by-term FP reassociation in weyl-lowering, green on every PR check, and
  # only covered because the accuracy tests were run by hand. This repo has been bitten before --
  # the GL4 step-halving bug was invisible precisely because its accuracy test was skip-by-default.
  # It stays a pull-request question: on a push it is false, as when this job did not run there.
  #
  # lean: does this change touch the Lean tree, its lake configuration, the Lean manifest and
  # index, the catalog that names the theorems, or this workflow? On a pull request against its
  # base, on a push to master against the commit it replaced (true when that commit is unknown).
  paths-touched:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      numerical: ${{ steps.check.outputs.numerical }}
      lean: ${{ steps.check.outputs.lean }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          lean_paths='^(lean/|lean\.lean$|lakefile\.toml$|lake-manifest\.json$|lean-toolchain$|formal/lean/|data/bridge-catalog\.json$|\.github/workflows/ci\.yml$)'
          if [ "$EVENT" = "pull_request" ]; then
            git fetch -q origin "$BASE_REF"
            changed=$(git diff --name-only "origin/$BASE_REF"...HEAD)
            numerical=false
            if printf '%s\n' "$changed" | grep -qE '^src/numerical/'; then numerical=true; fi
          else
            numerical=false
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              changed=$(git diff --name-only "$BEFORE" HEAD)
            else
              changed=lean/
            fi
          fi
          lean=false
          if printf '%s\n' "$changed" | grep -qE "$lean_paths"; then lean=true; fi
          echo "numerical=$numerical" >> "$GITHUB_OUTPUT"
          echo "lean=$lean" >> "$GITHUB_OUTPUT"
          echo "src/numerical/ touched on a pull request: $numerical (the accuracy suite runs when true)."
          echo "Lean tree, lake config, Lean manifest, catalog or this workflow touched: $lean (lake build runs when true)."

  long-tests:
    # This job runs UNCONDITIONALLY so that it can safely be a REQUIRED status context.
    #
    # It previously carried a job-level `if:` that skipped it on PRs touching no numerical code.
    # That made it unrequirable: a required context that never appears blocks the pull request
    # forever. So the job ran, could fail, and nothing stopped the merge -- a gauge wearing a
    # gate's name. Found 2026-08-29 by auditing required contexts against produced check names.
    #
    # The expensive suite is gated at STEP level instead. On a PR that touches no numerical code
    # the job still runs, does nothing, and reports success in seconds -- cheap, and crucially
    # always present for branch protection to match against.
    if: always()
    needs: [paths-touched]
    runs-on: ubuntu-latest
    steps:
      - id: should
        name: Decide whether the accuracy suite is needed
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] \
             || [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             || [ "${{ needs.paths-touched.outputs.numerical }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Accuracy suite WILL run for this event."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "src/numerical/ untouched and not a scheduled run -- accuracy suite not needed."
          fi
      - name: Setup Bun
        if: steps.should.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.should.outputs.run == 'true'
      # The suite includes the layer-order live gate, which reads origin/master.
      # This job runs that suite when src/numerical/ changes. A depth-1 checkout
      # of the pull-request branch does not have that ref.
      - name: Fetch master for the layer-order shrink check
        if: steps.should.outputs.run == 'true'
        run: git fetch origin master --depth=1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.should.outputs.run == 'true'
        with:
          node-version: 22
      - name: Restore Bun's install cache
        if: steps.should.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
        if: steps.should.outputs.run == 'true'
      - run: bun run build
        if: steps.should.outputs.run == 'true'
      # GL4_LONG=1 is the one switch. The long numerical tests derive their scope from it
      # (tests/helpers/gl4-long.ts): the gl4-integrator Picard run is 20 Mercury orbits at
      # 50k steps each, and the conserved-charge drift test is its full 10 orbits at 10k steps
      # (2 orbits at 2k when the switch is off). GL4_LONG_ORBITS and GL4_LONG_STEPS override
      # both for a hand run; they are not set here, so the nightly runs the full scope by name.
      - run: bunx vitest run
        if: steps.should.outputs.run == 'true'
        env:
          UPT_REQUIRE_PEERS: '1'
          GL4_LONG: '1'

  lean:
    # The Lean proofs moved here from PhysJS (11.0.0). `lean/` is outside the npm package
    # (package.json `files`); this job is the only thing that builds it. `lake build` uses the
    # Mathlib cache, then the axiom audit imports the module `lean` (the aggregator `lean.lean`)
    # and fails on `sorryAx`, `Lean.ofReduceBool`, or any axiom outside propext,
    # Classical.choice and Quot.sound. Theorem names stay `PhysJS.*`: namespaces, not paths.
    #
    # Like long-tests, the job always runs and gates its steps, so it reports on every change and
    # can be made a required context: the build runs on the nightly schedule, on a dispatch, and
    # when paths-touched says the Lean tree, its configuration, the Lean manifest, the catalog or
    # this workflow changed; otherwise it succeeds in seconds without building.
    #
    # Two caches replace lean-action's own (one whole `.lake` per commit, several GB each, which
    # evicts itself): `.lake/packages` (Mathlib's downloaded oleans and the Physlib build) keyed on
    # the toolchain and the lake manifest, so it is saved once per dependency set; and `.lake/build`
    # (this tree's oleans) keyed per commit and restored from the newest, so lake rebuilds only the
    # files that changed. Mathlib's own cache (`lake exe cache get`) is fetched only when the
    # packages cache misses: on a hit the oleans are already in `.lake/packages`, and `cache get`
    # re-downloaded all ~8900 archives anyway (about five minutes) before finding them decompressed.
    name: lake build and axiom audit
    if: always()
    needs: [paths-touched]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - id: should
        name: Decide whether the Lean build is needed
        env:
          EVENT: ${{ github.event_name }}
          LEAN_TOUCHED: ${{ needs.paths-touched.outputs.lean }}
        run: |
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ] || [ "$LEAN_TOUCHED" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "The Lean build WILL run for this event."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nothing the Lean build reads changed and this is not a scheduled run -- build not needed."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.should.outputs.run == 'true'
        with:
          persist-credentials: false
      - name: Restore the Lean dependencies (Mathlib oleans, Physlib build)
        id: lake-packages
        if: steps.should.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Restore this tree's Lean build
        if: steps.should.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Build and axiom audit
        if: steps.should.outputs.run == 'true'
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: ${{ steps.lake-packages.outputs.cache-hit == 'true' && 'false' || 'true' }}
          use-github-cache: "false"
          axiom-audit: "true"
          axiom-audit-root: "lean"
          axiom-audit-allow: "propext,Classical.choice,Quot.sound"
