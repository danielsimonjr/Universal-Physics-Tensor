name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# Pinned explicitly rather than inheriting the repository default. The default is `read`
# today, but it is a repo-level setting any future change can widen silently, and a workflow
# with no block inherits whatever it becomes. Every job here only checks out, builds, type-checks,
# tests, audits or diffs generated docs -- none of it needs more than read.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Bun first: it needs no repository content, and every job that invokes `bun` must install it.
      # Anchoring setup-bun to setup-node previously left jobs that lack the latter with rewritten
      # commands and no runtime to run them.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - uses: actions/checkout@v7
      # The shrink check reads tools/layer-order/allowlist.json from origin/master. A
      # depth-1 checkout of the pull-request branch does not have that ref.
      - name: Fetch master for the layer-order shrink check
        run: git fetch origin master --depth=1
      # Node stays: Bun is the package manager and script driver; Node is the runtime under test
      # and what the published library ships to. No `cache: npm` — package-lock.json is gone.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
        env:
          UPT_REQUIRE_PEERS: '1'
      # Product B's coverage gate (statements/lines/functions 95, branches 85). It was run only by hand, and
      # branch coverage fell below its threshold unnoticed; a gate CI does not run is a gauge, not a gate.
      - run: bun run test:probe-coverage

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - uses: actions/checkout@v7
      - name: Fetch master for the layer-order shrink check
        run: git fetch origin master --depth=1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run layer:check
      - run: bun run audit:plans
      - run: bun run package:check
      # `npm audit` requires package-lock.json; Bun owns the lockfile now.
      - run: bun audit --audit-level=high

  docs-fresh:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run docs:deps
      - name: Fail when committed architecture docs are stale
        run: |
          if ! git diff --quiet -- docs/architecture/; then
            echo "::error::docs/architecture/ is stale -- run 'bun run docs:deps' and commit the result."
            git diff --stat -- docs/architecture/
            exit 1
          fi
          echo "docs/architecture/ matches a fresh generation."
      - name: Fail when README and ROADMAP status spans are stale
        run: bun scripts/readme-status.ts --check
      - name: Fail when the CLI reference is stale
        run: bun scripts/cli-reference.ts --check
      - name: Fail when the PhysJS table is stale
        run: bun scripts/generate-physjs-table.ts --check
      # The pinned PhysJS files (manifest, lean/ listing, theorem -> file table) are copies of
      # PhysJS at the manifest's commit. Without a PhysJS checkout nothing compared them, so a hand
      # edit or a half-done re-pin passed every job. A depth-1 fetch of that one commit is enough:
      # the script reads only `git show` and `git ls-tree` at it. PhysJS is public; no token.
      - name: Fetch PhysJS at the pinned commit
        run: |
          commit=$(node -p "require('./formal/physjs/manifest.json').commit")
          git init -q "$RUNNER_TEMP/PhysJS"
          git -C "$RUNNER_TEMP/PhysJS" fetch -q --depth=1 https://github.com/danielsimonjr/PhysJS.git "$commit"
          echo "PHYSJS_CHECKOUT=$RUNNER_TEMP/PhysJS" >> "$GITHUB_ENV"
      - name: Fail when the vendored PhysJS files are not PhysJS's at the pin
        run: bun scripts/vendor-physjs.ts --physjs "$PHYSJS_CHECKOUT" --check

  # Non-required on purpose. The local pre-push hook still runs the private
  # code_docs.py against .githooks/code-docs-baseline.txt. A GitHub-UI merge
  # never runs that hook, so this job runs the in-repo --paths stand-in: a
  # changed src file may not add an export whose immediately preceding JSDoc
  # has no summary, and may not drop a summary the base ref had. Pre-existing
  # debt does not fail the job. The job does not read the baseline and does
  # not raise it.
  #
  # repo_map.py stays out of CI. It lives in a private repository, which is
  # the recorded decision (the pre-push hook says the same). This job does
  # not change branch protection. The check name says non-required so a
  # reader does not mistake it for one of the required contexts.
  code-docs-ratchet:
    name: code-docs ratchet (non-required)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Fail when this pull request adds an undocumented export
        run: bun tools/code-docs-ratchet/check.ts --base "origin/${{ github.base_ref }}"

  # Does this PR touch the numerical core? The accuracy suite below is expensive, so it is
  # schedule/dispatch-only -- but that meant a pull request could change floating-point code and
  # merge with the one suite that would catch a regression never having run. v0.44.3 was exactly
  # that shape: a term-by-term FP reassociation in weyl-lowering, green on every PR check, and
  # only covered because the accuracy tests were run by hand. This repo has been bitten before --
  # the GL4 step-halving bug was invisible precisely because its accuracy test was skip-by-default.
  #
  # Computed with git rather than a third-party paths-filter action: one less action to SHA-pin
  # and audit for a two-line diff check.
  numerical-touched:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch -q origin "${{ github.base_ref }}"
          if git diff --name-only "$base"...HEAD | grep -qE '^src/numerical/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "src/numerical/ touched -- the accuracy suite will run."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "src/numerical/ untouched -- accuracy suite stays on its nightly schedule."
          fi

  long-tests:
    # This job runs UNCONDITIONALLY so that it can safely be a REQUIRED status context.
    #
    # It previously carried a job-level `if:` that skipped it on PRs touching no numerical code.
    # That made it unrequirable: a required context that never appears blocks the pull request
    # forever. So the job ran, could fail, and nothing stopped the merge -- a gauge wearing a
    # gate's name. Found 2026-08-29 by auditing required contexts against produced check names.
    #
    # The expensive suite is gated at STEP level instead. On a PR that touches no numerical code
    # the job still runs, does nothing, and reports success in seconds -- cheap, and crucially
    # always present for branch protection to match against.
    if: always()
    needs: [numerical-touched]
    runs-on: ubuntu-latest
    steps:
      - id: should
        name: Decide whether the accuracy suite is needed
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] \
             || [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             || [ "${{ needs.numerical-touched.outputs.changed }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Accuracy suite WILL run for this event."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "src/numerical/ untouched and not a scheduled run -- accuracy suite not needed."
          fi
      - name: Setup Bun
        if: steps.should.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - uses: actions/checkout@v7
        if: steps.should.outputs.run == 'true'
      # The suite includes the layer-order live gate, which reads origin/master.
      # This job runs that suite when src/numerical/ changes. A depth-1 checkout
      # of the pull-request branch does not have that ref.
      - name: Fetch master for the layer-order shrink check
        if: steps.should.outputs.run == 'true'
        run: git fetch origin master --depth=1
      - uses: actions/setup-node@v7
        if: steps.should.outputs.run == 'true'
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
        if: steps.should.outputs.run == 'true'
      - run: bun run build
        if: steps.should.outputs.run == 'true'
      - run: bun run test
        if: steps.should.outputs.run == 'true'
        env:
          UPT_REQUIRE_PEERS: '1'
          GL4_LONG: '1'
