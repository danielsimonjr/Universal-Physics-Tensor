name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# contents: read checks out the tagged commit. id-token: write is what npm
# provenance asks Sigstore for. This job does not push, tag, or open a release.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Same runtime pins as ci.yml. Bun installs and drives scripts; Node 22 is
      # the runtime the published package is tested on, and the npm that publishes.
      # Every action is pinned to a commit: a tag can be moved, a commit cannot.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The suite includes the layer-order live gate, which reads origin/master.
      # A tag checkout is that commit only and does not have the ref. The test,
      # quality, and long-tests jobs fetch it the same way.
      - name: Fetch master for the layer-order shrink check
        run: git fetch origin master --depth=1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Restore Bun's install cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # ci.yml installs with Bun. There is no package-lock.json (the lockfile is
      # bun.lock), so `npm ci` cannot run.
      - run: bun install --frozen-lockfile
      # docs/persona-sessions/2026-10-01-library-api.md: the npm tarball at 0.47.1 was not
      # this tree at the same version string. Publishing the tagged commit, and
      # refusing when the tag (leading v removed) is not package.json's version,
      # is the guard. workflow_dispatch on a branch is not a v* tag, so it fails
      # here. The guard reads package.json only, so it runs before the build.
      - name: Refuse a tag whose version is not package.json's version
        run: node scripts/publish-version-guard.mjs "$GITHUB_REF_NAME"
      # The ONE run of the build, the typecheck and the suite is `prepublishOnly`
      # (`npm run validate`: build, typecheck of the tests project, vitest,
      # audit:plans, package:check), which `npm publish` runs itself. An explicit
      # `bun run test` step here once ran the whole suite a second time. The
      # peers are demanded on that run through the env below.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM }}
          UPT_REQUIRE_PEERS: '1'
